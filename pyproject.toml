[project]
name = "elevator-sim"
version = "0.1.0"
description = "Destination dispatch elevator simulation"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
elevator-sim = "elevator_sim.app.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elevator_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-horizon runs, skip with -m 'not slow'"]
